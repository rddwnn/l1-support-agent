[project]
name = "l1-support-agent"
version = "0.1.0"
description = "Bounded L1 support agent with deterministic tool authorization"
readme = "README.md"
authors = [
    { name = "Rodion Chikibaev", email = "r.chikibaev@innopolis.university" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
l1-support-agent = "l1_support_agent:main"
l1-support-agent-mcp = "l1_support_agent.mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
